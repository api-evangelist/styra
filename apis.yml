name: Styra
description: >-
  Styra is the company that created Open Policy Agent (OPA), the Cloud Native
  Computing Foundation graduated policy engine, and commercialized it as Enterprise
  OPA and Styra DAS (Declarative Authorization Service) for policy-as-code
  authorization across Kubernetes, microservices, APIs, and data. Styra was acquired
  by Akamai in December 2024; the styra.com and docs.styra.com properties no longer
  resolve, but OPA remains the de facto standard for cloud-native authorization and
  the open-source technical surface (GitHub, published SDKs, the OpenAPI spec, and
  gRPC protobufs) is active. The Enterprise OPA / OPA REST API evaluates Rego policy
  decisions, batch decisions, and partial-evaluation "data filtering" that compiles
  authorization into UCAST or SQL conditions. Backed originally by Accel and Battery
  Ventures.
