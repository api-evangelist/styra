note: >-
  Styra publishes Speakeasy-generated OPA / Enterprise OPA client SDKs in
  TypeScript, Java, and C#. The OpenAPI at openapi/styra-enterprise-opa-openapi.yaml
  is the source the SDKs are generated from. The `eopa` CLI is the Enterprise OPA
  distribution binary (see cli/styra-cli.yml).
